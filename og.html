<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image source — Tide Games · the Season DAO</title>
<!-- The social card, drawn from code like everything else in the fleet.
     Render at exactly 1200x630 and save as og-image.png. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% -10%,#1b3350 0%,#0f1c2b 55%,#0a1420 100%);
  font-family:Georgia,'Times New Roman',serif;color:#efe4c8;position:relative}
.sea{position:absolute;inset:0;overflow:hidden}
.sea i{position:absolute;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,#5fc7d633,transparent);}
.card{position:absolute;left:90px;top:88px;width:1020px;height:454px;border-radius:18px;
  background:linear-gradient(#f3e9d0,#efe4c8 40%,#e3d5b3);color:#2a2216;border:1px solid #c9b891;
  box-shadow:0 30px 80px rgba(0,0,0,.6);padding:44px 54px;display:flex;gap:40px}
.left{flex:1;display:flex;flex-direction:column}
.eyebrow{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#8a6508;font-weight:700}
h1{font-size:76px;line-height:1.02;margin:14px 0 16px;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:#8a6508}
p{font-size:28px;line-height:1.35;color:#5c4f3a;max-width:560px}
.badge{position:absolute;right:54px;top:44px;font-size:22px;color:#8a6508;border:2px solid #c9a24b;border-radius:999px;padding:8px 18px;background:#fff9ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:600}
.bars{width:300px;margin-top:84px;display:flex;flex-direction:column;gap:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:12px;font-size:20px;color:#5c4f3a}
.bar b{display:block;height:26px;border-radius:7px;background:linear-gradient(90deg,#7a5806,#e0a92a)}
.bar b.you{background:linear-gradient(90deg,#154f66,#2a86a8)}
.bar span{width:50px;text-align:right;font-variant-numeric:tabular-nums}
.foot{position:absolute;left:90px;right:90px;bottom:34px;display:flex;justify-content:space-between;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:22px;color:#b8ac9a;letter-spacing:.04em}
.foot b{color:#c9a24b}
</style>
</head>
<body>
<div class="sea">
  <i style="top:560px"></i><i style="top:585px;opacity:.6"></i><i style="top:610px;opacity:.3"></i>
</div>
<div class="card">
  <div class="left">
    <div class="eyebrow">Tide Games · the fleet</div>
    <h1>The <span>Season DAO</span></h1>
    <p>A million shares a season, one gold each, bought with sealed gold that never comes back. Who holds the season, drawn live.</p>
  </div>
  <div class="bars">
    <div class="bar"><b class="you" style="width:230px"></b><span>8.5%</span></div>
    <div class="bar"><b style="width:120px"></b><span>1.9%</span></div>
    <div class="bar"><b style="width:60px"></b><span>0.4%</span></div>
    <div class="bar"><b style="width:22px"></b><span>0.1%</span></div>
  </div>
  <div class="badge">⚓ seal-ready · one-way</div>
</div>
<div class="foot"><span><b>tide-games.github.io/dao</b></span><span>gold goes in and never comes out · a prize at season's end</span></div>
</body>
</html>
